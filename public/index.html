<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--load-bg,#f9f7f5);font-family:'Instrument Serif',serif}

.loading-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;flex-direction:column;
  background:var(--load-bg,#f9f7f5);position:relative;overflow:hidden;
}

/* Subtle petal scatter background */
.loading-screen::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 80%, rgba(169,189,196,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 80% 20%, rgba(141,136,99,0.08) 0%, transparent 60%);
}

.loading-inner{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:28px;
}

/* Flower spinner — uses the actual flower image, spins gently */
.flower-spinner{
  position:relative;width:72px;height:72px;
}
.flower-spinner img{
  width:100%;height:100%;object-fit:contain;
  animation:petalSpin 3s cubic-bezier(0.45,0.05,0.55,0.95) infinite;
  transform-origin:center;
  filter:drop-shadow(0 4px 12px rgba(141,136,99,0.25));
}
@keyframes petalSpin{
  0%   {transform:rotate(0deg)   scale(1)}
  25%  {transform:rotate(90deg)  scale(1.06)}
  50%  {transform:rotate(180deg) scale(1)}
  75%  {transform:rotate(270deg) scale(1.06)}
  100% {transform:rotate(360deg) scale(1)}
}

/* Floating petals */
.petal{
  position:absolute;width:16px;height:16px;
  animation:floatPetal 4s ease-in-out infinite;
  opacity:0;
}
.petal img{width:100%;height:100%;object-fit:contain;opacity:0.35;}
.petal:nth-child(1){top:-30px;left:-40px;animation-delay:0s;animation-duration:3.8s;}
.petal:nth-child(2){top:-20px;right:-45px;animation-delay:1.2s;animation-duration:4.2s;}
.petal:nth-child(3){bottom:-35px;left:-35px;animation-delay:0.7s;animation-duration:3.5s;}
.petal:nth-child(4){bottom:-25px;right:-40px;animation-delay:2s;animation-duration:4.5s;}
@keyframes floatPetal{
  0%  {opacity:0;transform:translateY(0) rotate(0deg) scale(0.8)}
  30% {opacity:1}
  70% {opacity:0.6}
  100%{opacity:0;transform:translateY(-18px) rotate(45deg) scale(1.1)}
}

.loading-title{
  font-family:'Instrument Serif',serif;
  font-size:1.5rem;color:var(--load-ink,#8d8863);
  font-weight:400;letter-spacing:0.02em;
  font-style:italic;
}
.loading-sub{
  font-family:'Instrument Serif',serif;
  font-size:0.82rem;color:var(--load-ink,#b5ad9a);opacity:0.7;
  letter-spacing:0.1em;margin-top:-16px;
}

/* Thin olive progress line */
.loading-line{
  width:120px;height:1px;background:var(--load-rule,#e8e4dc);
  position:relative;overflow:hidden;
  border-radius:999px;
}
.loading-line::after{
  content:'';position:absolute;left:-100%;top:0;
  width:100%;height:100%;background:var(--load-accent,#8d8863);
  animation:lineSlide 1.8s ease-in-out infinite;
  border-radius:999px;
}
@keyframes lineSlide{
  0%  {left:-100%}
  50% {left:0%}
  100%{left:100%}
}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-inner">

    <!-- Spinning flower with floating petals around it -->
    <div class="flower-spinner" style="position:relative">
      <!-- Floating mini petals -->
      <div class="petal"><img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png" alt=""></div>
      <div class="petal"><img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png" alt=""></div>
      <div class="petal"><img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png" alt=""></div>
      <div class="petal"><img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png" alt=""></div>
      <!-- Main spinning flower -->
      <img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png" alt="">
    </div>

    <div class="loading-title">Your celebration awaits</div>
    <div class="loading-line"></div>
    <div class="loading-sub">Loading...</div>

  </div>
</div>
<script>
const API = 'https://wedding-recommender.onrender.com';

// ── Template themes ─────────────────────────────────────────────────────────
// Each template's own loading motif and palette, mirroring TEMPLATES in
// site-runtime.js. Used to theme the loading screen so a couple never sees
// another template's design element while their site loads.
const TEMPLATE_THEME = {
  pressedpetals: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/5fb8a5ba-cd46-4296-ab23-0b2a2c718eae.png', bg: '#f9f7f5', ink: '#040505', accent: '#8d8863', rule: 'rgba(141,136,99,0.28)' },
  heirloombloom: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/4a57bd8a-41d2-4d52-a165-34aaa12e08f7.png', bg: '#f2ece7', ink: '#4a3a3d', accent: '#673d45', rule: 'rgba(103,61,69,0.28)' },
  blacktietimeless: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/cd72cd5d-9c8c-4074-8e11-a5b4a5f987d0.png', bg: '#f4f2ed', ink: '#1c2120', accent: '#1c2120', rule: 'rgba(28,33,32,0.24)' },
  goldenhour: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/89d6c221-6968-4779-ba69-a28ce2592e5e.png', bg: '#d7dde4', ink: '#32344b', accent: '#32344b', rule: 'rgba(50,52,75,0.24)' },
  sageandstill: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/9b9a3fea-d027-4ecc-9c71-dc5e5c6f04ae.png', bg: '#f5f3ee', ink: '#1f211d', accent: '#696c62', rule: 'rgba(105,108,98,0.28)' },
  modernminimal: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/9723a277-927a-432e-90a3-2e77afec42f3.svg', bg: '#fffdf5', ink: '#000000', accent: '#004aad', rule: 'rgba(0,0,0,0.18)' },
  whimsicalromance: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d522a767-03e5-4559-a323-153bd7c5606c.png', bg: '#fffdf5', ink: '#53141e', accent: '#e5989b', rule: 'rgba(83,20,30,0.24)' },
  coastalchic: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/9b5e87fe-b224-4bc4-9489-3488fd7e5964.svg', bg: '#fefaf1', ink: '#1b2a41', accent: '#5f7689', rule: 'rgba(27,42,65,0.22)' },
  vintagelovestory: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/2558bbd6-8fe8-4f9c-90a4-1b827ba7515d.svg', bg: '#f4efe6', ink: '#1a1a1a', accent: '#6b5844', rule: 'rgba(26,26,26,0.2)' },
  regalboho: { img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/ac4cb10b-9194-484b-bf23-70b7694d3c86.png', bg: '#f1e4c9', ink: '#53141e', accent: '#53141e', rule: 'rgba(83,20,30,0.24)' },
};

// Brand-neutral default. On a first visit we don't know the template until the
// API answers, so we show the MyPlanning.ai mark rather than borrowing one
// template's motif — the flower is Pressed Petals' and looked wrong on the
// other nine.
const BRAND_THEME = {
  img: 'https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/8815fd0e-bd66-4add-8c28-b9ec1e2509e3.png',
  bg: '#f9f7f5', ink: '#8d8863', accent: '#8d8863', rule: 'rgba(141,136,99,0.28)'
};

// After the first load we know which template this slug uses, so the next visit
// (and the redirect back from the template) can theme the loader immediately.
function rememberTemplate(slug, tid) {
  try { localStorage.setItem('tmpl_' + slug, tid); } catch (e) {}
}
function recallTheme(slug) {
  try {
    const tid = localStorage.getItem('tmpl_' + slug);
    if (tid && TEMPLATE_THEME[tid]) return TEMPLATE_THEME[tid];
  } catch (e) {}
  return BRAND_THEME;
}

// Paint the loading screen in the remembered template's colours and motif.
function applyLoadingTheme(theme) {
  try {
    const root = document.documentElement.style;
    root.setProperty('--load-bg', theme.bg);
    root.setProperty('--load-ink', theme.ink);
    root.setProperty('--load-accent', theme.accent);
    root.setProperty('--load-rule', theme.rule);
    document.querySelectorAll('.loading-screen img').forEach(img => { img.src = theme.img; });
  } catch (e) {}
}


// Map template label (as returned by the backend, lowercased) → template file.
// Add new templates here as you build them.
const TEMPLATE_MAP = {
  'pressed petals':      '/template-pressedpetals.html',
  'heirloom bloom':      '/template-heirloombloom.html',
  'black tie timeless':  '/template-blacktietimeless.html',
  'golden hour':         '/template-goldenhour.html',
  'sage & still':        '/template-sageandstill.html',
  'sage and still':      '/template-sageandstill.html',
  'modern minimal':      '/template-modernminimal.html',
  'whimsical romance':   '/template-whimsicalromance.html',
  'coastal chic':        '/template-coastalchic.html',
  'vintage love story':  '/template-vintagelovestory.html',
  'regal boho':          '/template-regalboho.html',

  // Generic style aliases (legacy fallback for older recommender outputs)
  'romantic':    '/template-pressedpetals.html',
  'elegant':     '/template-pressedpetals.html',
  'classic':     '/template-pressedpetals.html',
  'modern':      '/template-modernminimal.html',
  'minimalist':  '/template-modernminimal.html',
  'rustic':      '/template-pressedpetals.html',
};
const DEFAULT_TEMPLATE = '/template-pressedpetals.html';

// Parse slug from path: weddings.myplanning.ai/sarah-and-john
const path = window.location.pathname.split('/').filter(p => p);
const slug = path[0] || '';

// Theme the loader before anything else renders.
applyLoadingTheme(slug ? recallTheme(slug) : BRAND_THEME);

function templateFor(data) {
  const label = (data && data.template ? String(data.template) : '').toLowerCase();
  return TEMPLATE_MAP[label] || DEFAULT_TEMPLATE;
}

// '/template-coastalchic.html' -> 'coastalchic'
function templateIdFromFile(file) {
  const m = /template-([a-z]+)\.html/.exec(file || '');
  return m ? m[1] : '';
}

// Hand the payload to the template through sessionStorage so the template
// doesn't have to re-fetch, then redirect. The template KEEPS this key (it used
// to delete it), so a refresh on a password-protected site doesn't dead-end.
function handOff(data) {
  const file = templateFor(data);
  rememberTemplate(slug, templateIdFromFile(file));
  try { sessionStorage.setItem('weddingData_' + slug, JSON.stringify(data)); } catch (e) {}
  window.location.replace(file + '?slug=' + encodeURIComponent(slug));
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(String(iso).length === 10 ? iso + 'T00:00:00Z' : iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
  } catch (e) { return String(iso); }
}

// Generic branded screen. Takes real arguments in a fixed order — the previous
// version was called with two arguments in one place and three in another,
// which put body copy into the icon slot.
function showScreen(opts) {
  const o = opts || {};
  document.getElementById('loadingScreen').outerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:14px;text-align:center;padding:2.5rem 1.5rem;
      background:#f9f7f5;font-family:'Instrument Serif',serif;
      background-image:radial-gradient(ellipse 60% 40% at 20% 80%,rgba(169,189,196,0.12) 0%,transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 20%,rgba(141,136,99,0.08) 0%,transparent 60%)">
      ${o.icon ? `<div style="font-size:2.2rem;opacity:0.75">${escapeHtml(o.icon)}</div>` : ''}
      <div style="font-size:1.9rem;color:#8d8863;font-style:italic;line-height:1.2">${escapeHtml(o.title || '')}</div>
      ${o.date ? `<div style="font-size:0.78rem;color:#b5ad9a;letter-spacing:0.18em;text-transform:uppercase">${escapeHtml(o.date)}</div>` : ''}
      <div style="font-size:0.9rem;color:#8d8863;opacity:0.85;max-width:420px;line-height:1.6">${escapeHtml(o.sub || '')}</div>
      <div style="margin-top:2rem;padding-top:1.1rem;border-top:1px solid rgba(141,136,99,0.25);
        font-size:0.62rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(141,136,99,0.65)">myplanning.ai</div>
    </div>`;
}

function showPasswordScreen() {
  document.getElementById('loadingScreen').outerHTML = `
    <div id="pwScreen" style="
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;flex-direction:column;gap:24px;
      background:#f9f7f5;font-family:'Instrument Serif',serif;padding:2rem;
      background-image:radial-gradient(ellipse 60% 40% at 20% 80%,rgba(169,189,196,0.12) 0%,transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 20%,rgba(141,136,99,0.08) 0%,transparent 60%)">
      <img src="https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/d739d2eb-f460-4984-89fb-35511ea20510.png"
        style="width:56px;height:56px;object-fit:contain;opacity:0.55" alt="">
      <div style="text-align:center">
        <p style="font-size:1.8rem;color:#8d8863;font-style:italic;margin-bottom:6px">A private celebration</p>
        <p style="font-size:0.85rem;color:#b5ad9a;letter-spacing:0.06em">Enter the password to continue</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px">
        <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password"
          style="width:100%;padding:12px 20px;border:1px solid #d4cfc4;border-radius:999px;
            font-size:0.95rem;font-family:'Instrument Serif',serif;font-style:italic;
            outline:none;text-align:center;background:#fff;color:#040505;letter-spacing:0.05em">
        <button id="pwBtn"
          style="width:100%;padding:12px 20px;background:#8d8863;color:#fff;
            border:none;border-radius:999px;font-size:0.85rem;
            font-family:'Instrument Serif',serif;letter-spacing:0.1em;cursor:pointer">
          Enter
        </button>
        <div id="pwError" style="color:#c0392b;font-size:0.82rem;
          font-family:'Instrument Serif',serif;font-style:italic;display:none">
          Incorrect password — please try again.
        </div>
      </div>
    </div>`;
  document.getElementById('pwInput').focus();

  const tryPwd = async () => {
    const pwd = document.getElementById('pwInput').value.trim();
    const btn = document.getElementById('pwBtn');
    const err = document.getElementById('pwError');
    if (!pwd) return;
    btn.disabled = true; btn.textContent = 'Checking...'; err.style.display = 'none';
    try {
      const res  = await fetch(`${API}/wedding-site/${encodeURIComponent(slug)}?password=${encodeURIComponent(pwd)}`);
      const data = await res.json();
      if (data.password_required) {
        err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Enter';
        return;
      }
      // A correct password unlocks a draft site too (that's how couples preview
      // their own work), so re-check publish state before handing off.
      if (data.not_published) {
        showScreen({
          icon: '✨',
          title: data.couple_names || 'Coming soon',
          date: fmtDate(data.celebration_date),
          sub: (data.couple_names ? data.couple_names + ' are' : 'The hosts are') +
               ' putting the finishing touches on their wedding website. Please check back soon.'
        });
        return;
      }
      handOff(data);
    } catch {
      err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Enter';
    }
  };
  document.getElementById('pwInput').onkeydown = e => { if (e.key === 'Enter') tryPwd(); };
  document.getElementById('pwBtn').onclick = tryPwd;
}

async function main() {
  if (!slug) {
    showScreen({ icon: '🎊', title: 'Welcome to MyPlanning.ai', sub: 'Enter a celebration URL to get started.' });
    return;
  }

  try {
    const res = await fetch(`${API}/wedding-site/${encodeURIComponent(slug)}`);

    if (res.status === 404) {
      showScreen({ icon: '🔍', title: 'Page not found', sub: 'Check the URL and try again.' });
      return;
    }
    if (!res.ok) {
      showScreen({ icon: '⚠️', title: 'Something went wrong', sub: 'Please refresh and try again.' });
      return;
    }

    const data = await res.json();

    if (data.password_required) { showPasswordScreen(); return; }

    // Draft / Unpublished. The backend returns 200 with `not_published: true`
    // (plus names and date) rather than a 403, so this branch has to test the
    // flag. Previously it only checked for a 403 status that the backend no
    // longer sends, so draft sites fell through and rendered an empty template.
    if (data.not_published) {
      showScreen({
        icon: '✨',
        title: data.couple_names || 'Coming soon',
        date: fmtDate(data.celebration_date),
        sub: (data.couple_names ? data.couple_names + ' are' : 'The hosts are') +
             ' putting the finishing touches on their wedding website. Please check back soon.'
      });
      return;
    }

    // Published — including Save the Date mode. The template's runtime detects
    // website_mode and renders the announcement screen instead of the full site,
    // so routing is identical for both modes.
    handOff(data);

  } catch {
    showScreen({ icon: '⚠️', title: 'Something went wrong', sub: 'Please refresh and try again.' });
  }
}

main();
</script>
</body>
</html>

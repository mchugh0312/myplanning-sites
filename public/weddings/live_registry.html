<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wedding Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --sage:#A9BDC4; --olive:#4B5244; --cream:#F9F7F5; --ink:#121212;
    --muted:#8C7D6E; --border:#CBD5D8; --line:#EDE8E3; --gold:#C9A36A; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink);font-family:"Open Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Instrument Serif",serif;font-weight:400}
  /* Skinned type — set by applySkin() when the couple's template is known. */
  body.skinned{font-family:var(--skin-body,"Open Sans",sans-serif)}
  body.skinned .serif,
  body.skinned .rh-title,
  body.skinned .acc-head .serif,
  body.skinned .hero-text .date{font-family:var(--skin-display,"Instrument Serif",serif)}
  body.skinned .rh-note em,body.skinned .rh-note i{font-family:var(--skin-display,"Instrument Serif",serif)}
  body.skinned .search input{font-family:var(--skin-body,"Open Sans",sans-serif)}
  em{font-style:italic}
  a{color:inherit}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

  /* ── Hero (mirrors the registry dashboard) ──────────── */
  .hero{position:relative;min-height:320px;aspect-ratio:16/6;overflow:hidden;background:#E5E0D9}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.42) 100%)}
  .hero-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .hero-text h1{font-size:clamp(34px,7vw,64px);line-height:1.08;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.4)}
  .hero-text .date{margin-top:8px;font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(18px,3.4vw,28px);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}

  /* ── Header band ─────────────────────────────────────── */
  .head{background:var(--cream);text-align:center;padding:30px 20px 10px}
  .head h2{font-size:30px}
  .head p{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6}

  /* ── Sticky filter bar ──────────────────────────────── */
  .bar{position:sticky;top:0;z-index:40;background:var(--cream);box-shadow:0 1px 5px rgba(0,0,0,.07)}
  .bar-row{display:flex;align-items:center;gap:10px;padding:14px 0}
  .allbtn{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--border);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap}
  .allbtn .count{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;background:var(--olive);color:#fff;font-size:11px}
  .search{position:relative;flex:1;min-width:150px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .search input{width:100%;border:1px solid var(--border);background:var(--white);border-radius:999px;height:38px;padding:0 36px 0 34px;font-size:13px;color:var(--ink);outline:none;font-family:"Open Sans"}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--muted);line-height:0;padding:4px}
  .count-txt{font-size:13px;font-weight:600;color:var(--olive);white-space:nowrap}
  .sortbtn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:var(--white);border:1px solid var(--border)}
  .sortmenu{position:absolute;right:0;top:46px;z-index:50;background:var(--white);border:1px solid var(--sage);border-radius:10px;padding:6px;width:210px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  .sortmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;border-radius:7px;padding:9px 10px;font-size:13px;color:var(--ink)}
  .sortmenu button:hover{background:#f3f1ee}
  .pills{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:12px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--olive);color:#fff;border:1px solid var(--olive);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600}
  .pill button{border:none;background:transparent;color:rgba(255,255,255,.75);line-height:0;padding:0}

  /* ── Drawer (catalog style) ─────────────────────────── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:384px;background:var(--cream);z-index:70;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;box-shadow:-12px 0 40px -24px rgba(0,0,0,.5)}
  .drawer.open{transform:none}
  .drawer-pad{padding:24px}
  .drawer-top{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:18px}
  .drawer-top h3{font-size:22px}
  .sep{border-top:1px solid var(--sage);margin:20px 0}
  .grp-h{font-size:13px;font-weight:700;color:var(--olive);margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--sage);background:var(--white);color:var(--olive);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:500;transition:all .15s}
  .chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
  .ck{display:flex;align-items:center;gap:9px;margin:11px 0;cursor:pointer}
  .ck .box{width:17px;height:17px;border-radius:4px;border:2px solid var(--sage);display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s}
  .ck.on .box{background:var(--olive);border-color:var(--olive)}
  .ck span{font-size:13.5px}
  .drawer-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  .btn{border:none;border-radius:999px;padding:12px 0;font-size:14px;font-weight:600;width:100%}
  .btn-primary{background:var(--olive);color:#fff}
  .btn-primary:hover{opacity:.92}
  .btn-out{background:var(--white);border:1px solid var(--sage);color:var(--olive)}
  .x{border:none;background:transparent;color:var(--ink);line-height:0;padding:6px;font-size:16px}

  /* ── Accordions ─────────────────────────────────────── */
  .content{background:var(--cream);min-height:420px;padding-bottom:40px}
  .acc{border-bottom:1px solid rgba(75,82,68,.16)}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 8px;background:transparent;border:none}
  .acc-head .serif{font-size:24px;color:var(--ink)}
  .acc-head .n{font-size:12px;color:var(--olive);font-weight:600}
  .chev{transition:transform .26s ease;color:var(--olive)}
  .acc.open .chev{transform:rotate(180deg)}
  .acc-body{display:grid;grid-template-rows:0fr;opacity:.3;transition:grid-template-rows .26s ease,opacity .2s ease}
  .acc.open .acc-body{grid-template-rows:1fr;opacity:1}
  .acc-inner{overflow:hidden;min-height:0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:4px 0 34px;align-items:stretch}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}

  /* ── Cards ──────────────────────────────────────────── */
  .card{display:flex;flex-direction:column;background:var(--white);border-radius:4px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.06)}
  .card-click{cursor:pointer;display:flex;flex-direction:column;flex:1 1 auto}
  .imgwrap{position:relative;height:230px;background:var(--white);border:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .imgwrap img{width:100%;height:100%;object-fit:cover}
  .ph{color:var(--border)}
  .badges{position:absolute;top:10px;left:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
  .badge{font-family:"Open Sans",sans-serif;font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--ink);background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .badge.want{background:rgba(255,255,255,.92);color:var(--olive)}
  .badge.group{background:rgba(255,255,255,.92);color:var(--muted)}
  .badge.exp{background:rgba(255,255,255,.92);color:var(--muted)}
  .card .body{text-align:center;margin-top:9px;padding:0 12px}
  .card .src{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
  .card .ttl{font-size:13px;color:var(--ink);line-height:1.3;margin-bottom:3px;min-height:34px}
  /* MP-391: which colour and size this card is. Without it, two sizes of one
     sheet set are two identical cards at different prices. min-height keeps
     cards level whether or not a gift has options. */
  .variant{display:flex;align-items:center;justify-content:center;gap:5px;
           font-size:11.5px;color:var(--muted);margin-bottom:4px;min-height:16px}
  .m-variant{display:flex;align-items:center;justify-content:center;gap:6px;
             font-size:12.5px;color:var(--muted);margin:2px 0 6px}
  .vdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;
        border:1px solid rgba(0,0,0,.15);display:inline-block}
  .card .price{font-family:"Instrument Serif",serif;font-size:16px}
  .card .sub{font-size:11px;color:var(--olive);margin-top:2px}
  .progress{height:5px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;margin:8px 2px 0}
  .progress > i{display:block;height:100%;background:var(--gold);border-radius:999px}
  .cta-row{display:flex;gap:7px;margin-top:11px;padding:0 12px 14px;align-items:flex-start}
  .cta{flex:1;border:none;border-radius:999px;padding:9px 0;font-size:12.5px;font-weight:600;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .cta.solid{background:var(--sage);color:#fff}
  .cta.solid:hover{opacity:.92}
  .cta.out{background:transparent;border:1px solid var(--olive);color:var(--olive)}
  .cta.out:hover{background:rgba(75,82,68,.06)}

  .empty{text-align:center;color:#fff;padding:70px 20px}
  .empty .ring{width:84px;height:84px;border-radius:999px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

  /* ── Modal ──────────────────────────────────────────── */
  .m-scrim{position:fixed;inset:0;background:rgba(18,18,18,.55);display:none;align-items:flex-end;justify-content:center;z-index:80}
  .m-scrim.open{display:flex}
  @media(min-width:640px){.m-scrim{align-items:center;padding:20px}}
  .modal{background:var(--cream);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
  @media(min-width:640px){.modal{border-radius:12px}}
  .m-img{aspect-ratio:16/10;background:var(--white);position:relative;overflow:hidden}
  .m-img img{width:100%;height:100%;object-fit:cover}
  .m-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px}
  .m-pad{padding:22px}
  .m-pad h3{font-size:25px;line-height:1.15;margin-bottom:4px}
  .m-sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .m-price{font-family:"Instrument Serif",serif;font-size:21px;margin:2px 0 6px}
  .m-desc{font-size:13.5px;line-height:1.6;color:var(--olive);margin:10px 0}
  .m-note{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--olive);font-style:italic;margin:12px 0}
  .m-actions{display:flex;gap:10px;margin-top:14px}
  .m-done{margin-top:14px;padding:10px 12px;border-radius:8px;background:rgba(75,82,68,.08);
          color:var(--olive);font-size:13px;text-align:center}
  .m-actions .cta{padding:13px 0;font-size:14px;border-radius:999px}
  .field{margin-top:12px}
  .field label{display:block;font-family:"Instrument Serif",serif;font-size:14px;margin-bottom:5px}
  .field input,.field textarea{width:100%;border:1px solid var(--ink);background:var(--white);border-radius:6px;padding:10px 12px;font-size:14px;font-family:"Open Sans";outline:none}
  .field textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--olive);margin-top:12px;cursor:pointer}
  .mbtn{width:100%;border:none;border-radius:999px;padding:13px 0;font-size:14px;font-weight:600;margin-top:10px}
  .mbtn.primary{background:var(--olive);color:#fff}
  .mbtn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
  .pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .pay-opt{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--border);border-radius:8px;padding:10px 4px;font-size:11px;font-weight:600;text-decoration:none;color:var(--olive);background:var(--white)}
  .hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .banner{position:fixed;top:0;left:0;right:0;z-index:95;text-align:center;padding:13px 18px;font-size:14px;font-weight:600;color:#fff;transform:translateY(-100%);transition:transform .35s}
  .banner.show{transform:none}
  .banner.success{background:var(--olive)}
  .banner.info{background:var(--muted)}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(150deg,#A9BDC4,#4B5244)}
  .gate-card{background:var(--cream);border-radius:14px;padding:34px 28px;max-width:380px;width:100%;text-align:center}
  .gate-card h2{font-size:26px;margin-bottom:6px}
  .gate-card p{font-size:13px;color:var(--muted);margin-bottom:18px}
  .center-load{min-height:70vh;display:flex;align-items:center;justify-content:center;background:var(--cream)}
  .center-load .spinner{width:30px;height:30px;border-color:rgba(255,255,255,.4);border-top-color:#fff}

  /* Outside / external registry links */
  .ext-wrap{background:var(--cream);padding:34px 20px 40px}
  .ext-head{text-align:center;margin-bottom:20px}
  .ext-head p{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6}
  .ext-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:720px;margin:0 auto}
  .ext-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;transition:box-shadow .15s,transform .15s}
  .ext-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-1px)}
  .ext-label{font-size:18px;color:var(--ink)}
  .ext-go{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--olive);white-space:nowrap}

/* ── Preview mode: rearrange ─────────────────────────────── */
.pv-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        background:rgba(255,255,255,.18);padding:3px 8px;border-radius:999px;flex-shrink:0;}
        border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;}

.card.draggable{cursor:grab;position:relative;}
.card.draggable:active{cursor:grabbing;}
.card.draggable .card-click{cursor:grab;}
.card.dragging{opacity:.45;transform:scale(.97);}
.card.drop-target{outline:2px dashed #C9A36A;outline-offset:3px;}
.card.drop-before::before,.card.drop-after::after{content:"";position:absolute;top:6px;bottom:6px;width:3px;background:#C9A36A;border-radius:2px;z-index:6;pointer-events:none;}
.card.drop-before::before{left:-10px;}
.card.drop-after::after{right:-10px;}

.pv-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
          background:#121212;color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;z-index:200;
          transition:opacity .2s ease,transform .2s ease;}
.pv-toast.show{opacity:1;transform:translate(-50%,0);}
.pv-toast.bad{background:#C23331;}

/* ── Editable hero (preview) ─────────────────────────────── */
.hero .hero-note{font-size:13px;line-height:1.65;color:rgba(255,255,255,.92);max-width:340px;margin:10px 0 0;}
.hero .couple-sig{margin-top:14px;font-size:15px;font-style:italic;color:rgba(255,255,255,.95);}
.hero.editable .ed{outline:1px dashed rgba(255,255,255,.5);outline-offset:4px;border-radius:3px;cursor:text;}
.hero.editable .ed:hover,.hero.editable .ed:focus{outline-color:#C9A36A;background:rgba(0,0,0,.12);}
.cover-edit{position:absolute;top:14px;left:14px;z-index:4;display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.94);color:#4B5244;border-radius:999px;padding:7px 13px;font-size:12px;
  font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.cover-edit input{display:none;}

/* ── Card: heart, centre drag handle, couple note ─────────── */
.card{position:relative;}
.heart{position:absolute;top:10px;right:10px;z-index:4;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.14);}
.heart.tap{cursor:pointer;}
.heart.tap:hover{transform:scale(1.08);}
.cnote{margin-top:8px;font-size:11.5px;line-height:1.5;color:#4B5244;font-style:italic;
  background:#F4F1EC;border-radius:6px;padding:7px 9px;text-align:left;}
.cnote .q{font-family:"Instrument Serif",serif;font-size:15px;margin-right:2px;}
/* MP-419. The opening mark had a 2px right margin and no closing mark at all,
   which read as a space after the quote and no quote at the end. The closing
   one mirrors it. */
.cnote .q.close{margin-right:0;margin-left:2px;}
.cta-row.col{flex-direction:column;gap:7px;align-items:stretch;}
.ipurch{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#8C7D6E;cursor:pointer;}
.ipurch input{accent-color:#4B5244;cursor:pointer;}

.card.draggable{cursor:grab;}
.card.draggable:active{cursor:grabbing;}
.card.dragging{opacity:.45;transform:scale(.97);}
.card.drop-target{outline:2px dashed #C9A36A;outline-offset:3px;}

/* ── Flow modals (How it works / Did you purchase / Form) ── */
.modal-wrap{position:fixed;inset:0;z-index:150;background:rgba(18,18,18,.5);display:none;
  align-items:center;justify-content:center;padding:16px;}
.modal-wrap.show{display:flex;}
.modal-card{position:relative;width:100%;max-width:380px;background:#F9F7F5;border-radius:6px;
  padding:26px 22px 0;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.m-x{position:absolute;top:12px;right:12px;background:transparent;border:none;cursor:pointer;color:#8C7D6E;}
.m-title{text-align:center;font-size:22px;font-weight:400;margin:0 0 14px;}
.m-body{text-align:center;font-size:12.5px;line-height:1.75;color:#4B5244;margin:0 0 12px;}
.modal-card .m-img{display:block;width:96px;height:96px;object-fit:contain;margin:6px auto 10px;}
.m-prod{text-align:center;margin-bottom:14px;}
.m-brand{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8C7D6E;}
.m-name{font-size:13px;color:#121212;margin-top:2px;}
.modal-card .m-price{font-family:"Instrument Serif",serif;font-size:15px;margin-top:2px;}
.modal-card .m-actions{display:flex;justify-content:center;gap:8px;margin-bottom:18px;}
.modal-card .m-actions.col{flex-direction:column;align-items:center;}
.m-cta{border-radius:999px;font-size:12px;font-weight:600;height:34px;padding:0 22px;cursor:pointer;

/* ── Filter / sort row: dropdowns on a single line ── */
.qf{background:#F9F7F5;border-bottom:1px solid var(--border);}
.qf .wrap{max-width:1180px;margin:0 auto;padding:12px 20px;}
.qf-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
/* Three filters share the row equally: flex-basis 0 with grow 1 means each is
   sized by the space available rather than by its longest option, so "All
   categories" and "Any price" come out the same width. min-width:0 lets them
   shrink; without it the select's intrinsic width sets a floor and the row
   goes ragged again. */
.fsel{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);
  border-radius:999px;padding:5px 6px 5px 14px;flex:1 1 0;min-width:0;}

/* Count immediately before the pill, the pair pushed right together: the
   auto margin sits on the COUNT now, not on the sort wrapper, so the gap opens
   to the left of both rather than between them. */

  color:var(--ink);cursor:pointer;padding:2px 4px;flex:1 1 auto;width:100%;}
.qf-count{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;}
/* MP-414. On a phone the four filter pills wrapped one per row, each stretched
   by flex:1 1 auto to the full width, with the select capped at 120px. The
   label sat left, the select sat next to it, and the rest of the pill was empty
   air, so the control read as floating in the middle of an over-long bar.

   Two per row, each pill sized to half the line, and the select fills what is
   left of it with its text against the right edge beside the chevron. */
/* MP-414. On a phone the three filters stay on ONE line and stay equal: the
   label is dropped (the selected value already says what it is, and "All
   categories" is its own label) and the type comes down a point. Nothing wraps,
   so nothing can end up a different size from its neighbour. */

}

<script>
const RENDER_API = "https://wedding-recommender.onrender.com";
const CASH_FUND_TYPE = "343960eb-ce49-45d6-89b5-0bbe43d877f6";
const HERO_PLACEHOLDER = "https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/b7a1cd5a-6c8b-4cb6-aba5-febf0c243676.webp";
const CASHFUND_BG   = HERO_PLACEHOLDER;
// Same default the Experiences block uses, so an experience with no photo of
// its own looks identical to the couple and to their guests.
const EXPERIENCE_BG = "https://assets.softr-files.com/applications/98da9671-14f5-418f-b98a-6f8fb833401f/assets/5ee71dce-62f8-44be-9d0a-0ffa49a7e8c2.webp";

const GROUPS = [
  { key:"physical", label:"Physical Gifts",       kind:"gift" },
  { key:"funds",    label:"Cash Funds",            kind:"fund" },
  { key:"exp",      label:"Honeymoon Experiences", kind:"experience" },
];

const PRICE_BUCKETS = [
  {id:"under50", label:"Under $50",  test:c=>c<5000},
  {id:"50-100",  label:"$50 to $100",   test:c=>c>=5000&&c<10000},
  {id:"100-250", label:"$100 to $250",  test:c=>c>=10000&&c<25000},
  {id:"250-500", label:"$250 to $500",  test:c=>c>=25000&&c<50000},
  {id:"over500", label:"$500+",      test:c=>c>=50000},
];
const SORT_OPTIONS = [
  {value:"custom",     label:"Couple's order"},
  {value:"price_asc",  label:"Price (Low to High)"},
  {value:"price_desc", label:"Price (High to Low)"},
  {value:"name_asc",   label:"Name (A to Z)"},
  {value:"name_desc",  label:"Name (Z to A)"},
];

const state = {
  registryId:null, slug:null, preview:false, password:null, reorder:false, howItem:null, pendingAsk:null,
  data:null, things:[],
  filters:{ search:"", cats:new Set(), price:new Set(), status:"all", sort:"custom" },
  open:new Set(),            // collapsed by default — nothing open
  sortOpen:false,
  activeItem:null, activeExp:null,
};

const fmt = c=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format((Number(c)||0)/100);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
// Safe inline markdown: escape first (no HTML/scripts can inject), then turn
// **bold** and *italic* into <strong>/<em>. Matches the Registry Settings editor.
const mdInline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
// Reverse of mdInline: a contenteditable's DOM back to plain text with markers.
// Walks nodes rather than regexing innerHTML, so browser-inserted markup still
// serialises cleanly. The title field must never hold HTML.
function mdFromNode(node){
  if(!node) return "";
  function walk(n){
    if(n.nodeType===3) return String(n.nodeValue||"");
    if(n.nodeType!==1) return "";
    var inner = Array.prototype.map.call(n.childNodes, walk).join("");
    if(!inner.trim()) return inner;
    var t = n.tagName;
    if(t==="B"||t==="STRONG") return "**"+inner+"**";
    if(t==="I"||t==="EM") return "*"+inner+"*";
    if(t==="BR") return " ";
    return inner;
  }
  return Array.prototype.map.call(node.childNodes, walk).join("").replace(/\s+/g," ").trim();
}
const el  = id=>document.getElementById(id);
const isFund = it=> it.item_type_id===CASH_FUND_TYPE || (Number(it.price_cents)===0 && Number(it.goal_amount_cents)>0);


/* ─── Template theming ──────────────────────────────────────────────
   The registry opens from the couple's wedding site at /{slug}/registry, so
   it should look like the site the guest just left rather than the fixed
   sage/olive palette. Colours and type come from whichever template the
   couple picked.

   Templates that use local @font-face files (Citadel Script, Parfumerie,
   Holiday, Sloop) map to the closest Google face — those font files aren't
   served to this page. */
const TEMPLATE_SKIN = {
  pressedpetals: { bg:"#f9f7f5", ink:"#040505", accent:"#8d8863", panel:"#8d8863", display:"'Pinyon Script',cursive", body:"'Instrument Serif',serif", gfont:"Pinyon+Script&family=Instrument+Serif:ital@0;1" },
  heirloombloom: { bg:"#f2ece7", ink:"#4a3a3d", accent:"#673d45", panel:"#673d45", display:"'Luxurious Script',cursive", body:"'Lancelot',Georgia,serif", gfont:"Luxurious+Script&family=Lancelot" },
  blacktietimeless: { bg:"#f4f2ed", ink:"#1c2120", accent:"#1c2120", panel:"#1c2120", display:"'Ballet',cursive", body:"'EB Garamond',Georgia,serif", gfont:"Ballet&family=EB+Garamond:wght@400;600" },
  goldenhour: { bg:"#d7dde4", ink:"#32344b", accent:"#32344b", panel:"#32344b", display:"'La Belle Aurore',cursive", body:"'EB Garamond',Georgia,serif", gfont:"La+Belle+Aurore&family=EB+Garamond:wght@400;600" },
  sageandstill: { bg:"#f5f3ee", ink:"#1f211d", accent:"#696c62", panel:"#696c62", display:"'Aboreto',serif", body:"'DM Sans',system-ui,sans-serif", gfont:"Aboreto&family=DM+Sans:wght@400;600" },
  modernminimal: { bg:"#fffdf5", ink:"#000000", accent:"#004aad", panel:"#004aad", display:"'Poppins',sans-serif", body:"'Poppins',sans-serif", gfont:"Poppins:wght@300;400;600" },
  whimsicalromance: { bg:"#fffdf5", ink:"#53141e", accent:"#e5989b", panel:"#e5989b", display:"'Corben',Georgia,serif", body:"'Nunito Sans',system-ui,sans-serif", gfont:"Corben:wght@400;700&family=Nunito+Sans:wght@400;600" },
  coastalchic: { bg:"#fefaf1", ink:"#1b2a41", accent:"#5f7689", panel:"#5f7689", display:"'La Belle Aurore',cursive", body:"'Lexend Deca',sans-serif", gfont:"La+Belle+Aurore&family=Lexend+Deca:wght@400;600" },
  vintagelovestory: { bg:"#f4efe6", ink:"#1a1a1a", accent:"#6b5844", panel:"#6b5844", display:"'Instrument Serif',Georgia,serif", body:"'Inter',system-ui,sans-serif", gfont:"Instrument+Serif&family=Inter:wght@400;600" },
  regalboho: { bg:"#f1e4c9", ink:"#53141e", accent:"#53141e", panel:"#53141e", display:"'Libre Baskerville',Georgia,serif", body:"'Noto Serif',Georgia,serif", gfont:"Libre+Baskerville:ital@0;1&family=Noto+Serif:wght@400;600" },
};

/* The wedding site stashes its payload in sessionStorage under the same
   origin, so on a click-through we can theme instantly with no extra request.
   A guest opening the registry link directly falls back to a fetch. */
function readStashedSite(slug){
  try {
    const raw = sessionStorage.getItem("weddingData_" + slug);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function skinFor(data){
  if (!data) return null;
  const label = String(data.template || "").toLowerCase().replace(/[^a-z]/g, "");
  const byId = TEMPLATE_SKIN[label];
  if (byId) return { skin: byId, customization: data.customization || {} };
  const alias = {
    sagestill:"sageandstill", sageandstill:"sageandstill",
    pressedpetals:"pressedpetals", heirloombloom:"heirloombloom",
    blacktietimeless:"blacktietimeless", goldenhour:"goldenhour",
    modernminimal:"modernminimal", whimsicalromance:"whimsicalromance",
    coastalchic:"coastalchic", vintagelovestory:"vintagelovestory",
    regalboho:"regalboho",
  }[label];
  return alias ? { skin: TEMPLATE_SKIN[alias], customization: data.customization || {} } : null;
}

function applySkin(found){
  if (!found || !found.skin) return;
  const s = found.skin, cz = found.customization || {};
  const bg     = cz.accent_color  || s.bg;
  const accent = cz.primary_color || s.accent;
  const ink    = cz.text_color    || s.ink;

  if (s.gfont && !document.getElementById("skin-font")) {
    const l = document.createElement("link");
    l.id = "skin-font"; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + s.gfont + "&display=swap";
    document.head.appendChild(l);
  }

  const r = document.documentElement.style;
  r.setProperty("--cream", bg);
  r.setProperty("--olive", accent);
  r.setProperty("--ink", ink);
  r.setProperty("--skin-display", s.display);
  r.setProperty("--skin-body", s.body);

  // The page ground alone wasn't enough to make this read as part of the
  // wedding site: the chrome around the cards — chips, borders, rules, the
  // secondary accent — all stayed on the MyPlanning palette, so only the
  // welcome panel looked themed. These derive from the template's own colours
  // so the whole page belongs to the same set.
  //
  // Card faces stay white deliberately: product photography needs a neutral
  // ground, and tinting it would fight every retailer's cut-out image.
  r.setProperty("--sage",   mix(accent, bg, 0.55));   // secondary accent
  r.setProperty("--border", mix(ink,    bg, 0.78));   // input and chip edges
  r.setProperty("--line",   mix(ink,    bg, 0.88));   // hairlines
  r.setProperty("--muted",  mix(ink,    bg, 0.42));   // secondary text
  r.setProperty("--gold",   accent);                  // note accent bar

  document.body.classList.add("skinned");
}

/* Blends two hex colours; `amount` is how far to move from `a` toward `b`. */
function mix(a, b, amount){
  const hex = h => {
    const v = String(h || "").replace("#", "");
    const f = v.length === 3 ? v.split("").map(c => c + c).join("") : v;
    return [parseInt(f.slice(0,2),16), parseInt(f.slice(2,4),16), parseInt(f.slice(4,6),16)];
  };
  const [r1,g1,b1] = hex(a), [r2,g2,b2] = hex(b);
  if ([r1,g1,b1,r2,g2,b2].some(isNaN)) return a;
  const ch = (x,y) => Math.round(x + (y - x) * amount).toString(16).padStart(2,"0");
  return "#" + ch(r1,r2) + ch(g1,g2) + ch(b1,b2);
}

/* Theme as early as possible, then confirm against the API for guests who
   opened the registry link cold. */
function initSkin(){
  // Three cases:
  //   a couple with a published site  -> their template's colours and type
  //   a couple whose site is a draft  -> still their template, from the payload
  //   a registry with no site at all  -> the MyPlanning palette in :root
  // The last one needs no work: leaving the variables alone IS the brand theme.
  // Only mark the body so the type rules know which way round we are.
  // No slug YET is not the same as no website: on a preview the slug arrives
  // with the payload a moment later, and load() calls back in. Only commit to
  // the brand theme once there is nothing left to wait for.
  if (!state.slug) {
    if (!state.preview) document.body.classList.add("brandskin");
    return;
  }
  document.body.classList.remove("brandskin");

  const stashed = readStashedSite(state.slug);
  if (stashed) { applySkin(skinFor(stashed)); return; }

  fetch(RENDER_API + "/wedding-site/" + encodeURIComponent(state.slug))
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      // A draft or password-protected site still tells us the template, and a
      // couple previewing their own registry should see their skin either way.
      const found = d ? skinFor(d) : null;
      if (found) applySkin(found);
      else document.body.classList.add("brandskin");
    })
    .catch(() => { document.body.classList.add("brandskin"); });
}

/* ─── Boot ─────────────────────────────────────────── */
(function init(){
  const params = new URLSearchParams(location.search);
  const m = location.pathname.match(/\/([^\/]+)\/registry\/?$/);
  if (m && m[1] && m[1]!=="preview") state.slug = decodeURIComponent(m[1]);
  state.registryId = params.get("id");
  state.preview = params.get("preview")==="1" || params.get("preview")==="true";
  const c = params.get("contribution");
  if (c==="success"){ showBanner("Thank you so much! Your gift has been received. 💌","success"); cleanParam("contribution"); }
  else if (c==="cancel"){ showBanner("No worries, your checkout was cancelled.","info"); cleanParam("contribution"); }
  initSkin();          // colours + type from the couple's template
  renderBrandFooter(); // same footer as the wedding sites
  loadShipMethods();   // carrier list for the tracking forms
  load();

  /* MP-379: the preview loaded once, so a couple who added a gift in the
     dashboard tab came back here, saw the old list, and reasonably concluded
     nothing had saved. Reload when this tab is looked at again. Throttled, and
     skipped while a modal is open so a refresh cannot pull the ground out from
     under something being filled in. */
  if (state.preview) {
    document.addEventListener("visibilitychange", refreshPreviewOnReturn);
    window.addEventListener("focus", refreshPreviewOnReturn);
    window.addEventListener("pageshow", function(e){ if (e.persisted) refreshPreviewOnReturn(); });
  }
})();

var _lastPreviewReload = Date.now();
function refreshPreviewOnReturn(){
  if (!state.preview || document.hidden) return;
  // A modal, the drawer or a flow being open all mean "do not reload now".
  if (document.querySelector(".scrim.open, .m-scrim.open, .modal-card.open")) return;
  const now = Date.now();
  if (now - _lastPreviewReload < 2500) return;
  _lastPreviewReload = now;
  load();
}
function cleanParam(k){ const u=new URL(location.href); u.searchParams.delete(k); history.replaceState({},"",u); }
function showBanner(msg,kind){ const b=el("banner"); b.textContent=msg; b.className="banner "+kind+" show"; setTimeout(()=>b.classList.remove("show"),5200); }

async function load(){
  try{
    let url = state.slug
      ? RENDER_API+"/public/registry/by-slug/"+encodeURIComponent(state.slug)
      : RENDER_API+"/public/registry/"+encodeURIComponent(state.registryId||"");
    const qp=[];
    if(state.preview) qp.push("preview=1");
    if(state.password) qp.push("password="+encodeURIComponent(state.password));
    // Cache-bust in preview only. Guests should keep the benefit of caching;
    // the couple checking their own edits must not.
    if(state.preview) qp.push("_="+Date.now());
    if(qp.length) url += "?"+qp.join("&");
    const res = await fetch(url, state.preview ? { cache: "no-store" } : undefined);
    const data = await res.json();
    if(data.error==="not_published") return renderNotice("This registry isn't published yet.","Check back soon. The couple is still putting it together.");
    if(data.password_required) return renderGate(data.title||"Our Registry", data.password_invalid);
    state.data = data;
    if(!state.registryId && data.registry) state.registryId = data.registry.id;
    // Preview opens by id, so the slug is not in the path. The payload has it,
    // which is what lets the preview match the live page instead of always
    // falling back to the MyPlanning theme.
    if(state.preview && !state.slug){
      const slug = data.registry && data.registry.website_slug;
      if(slug){
        state.slug = slug;      // now initSkin can find the template
        initSkin();
      } else {
        // No website at all: the MyPlanning theme IS the answer here, and
        // initSkin deliberately withholds it on a preview until we know.
        document.body.classList.add("brandskin");
      }
    }
    buildThings();
    render();
  }catch(e){ renderNotice("We couldn't load this registry.","Please refresh the page or try again in a moment."); }
}

/* The chosen variant, written the way a guest reads it: "Slate Blue · Queen".
   Returns "" when the gift has no options, so nothing is added to a plain item. */
function variantLabel(it){
  const parts = [];
  if(it && it.selected_color) parts.push(String(it.selected_color));
  if(it && it.selected_size)  parts.push(String(it.selected_size));
  return parts.join(" \u00b7 ");
}

/* A colour chip in front of the label, when the catalogue gave us a hex. Guests
   pick out a colour far faster than they read one. */
function variantHtml(it, cls){
  const label = variantLabel(it);
  if(!label) return "";
  const hex = it && it.variant_color_hex ? String(it.variant_color_hex) : "";
  const dot = /^#[0-9a-f]{3,8}$/i.test(hex)
    ? '<span class="vdot" style="background:'+esc(hex)+'"></span>' : "";
  return '<div class="'+(cls||"variant")+'">'+dot+esc(label)+'</div>';
}

function buildThings(){
  const things=[];
  (state.data.items||[]).forEach(it=>{
    const fund=isFund(it);
    things.push({
      kind: fund?"fund":"gift", raw:it, id:it.id, title:it.title,
      image: it.image_url || (fund?CASHFUND_BG:""),
      amount: fund?(Number(it.goal_amount_cents)||0):(Number(it.price_cents)||0),
      fcat: fund?"":(it.category||""),
      mostWanted:!!it.is_most_wanted, group:!!it.is_group_gift,
      hasTracking:!!it.has_tracking,
      sort: it.sort_order==null?9999:it.sort_order,
    });
  });
  (state.data.experiences||[]).forEach(e=>{
    things.push({
      kind:"experience", raw:e, id:e.id, title:e.title,
      image: e.image_url||EXPERIENCE_BG,
      amount: Number(e.cost_cents)||0, received:Number(e.amount_received_cents)||0,
      location:e.location||"", fcat:"",
      mostWanted:false, group:false, sort:e.sort_order==null?9999:e.sort_order,
    });
  });
  state.things=things;
}

function categoriesAvailable(){
  const s=new Set();
  state.things.forEach(t=>{ if(t.kind==="gift"&&t.fcat) s.add(t.fcat); });
  return Array.from(s).sort();
}

/* toggleSort, setSort and the close-on-outside-click listener already exist
   further down this file — the sort pill was built here once and then replaced
   by a <select>. The markup above uses them rather than declaring a second set:
   two `function toggleSort` in one script is legal and silently keeps the last
   one, which is exactly the kind of thing that bites six months later. */

/* Single-select helpers (the dropdowns replace multi-select chips). */
function pickCat(v){ state.filters.cats.clear(); if(v) state.filters.cats.add(v); render(); }
function pickPrice(v){ state.filters.price.clear(); if(v) state.filters.price.add(v); render(); }
function setStatus(s){ state.filters.status=s; render(); }
function clearAllFilters(){
  state.filters.cats.clear(); state.filters.price.clear();
  state.filters.status="all"; state.filters.search=""; render();
}
/* MP-392: a link saved without a scheme resolves relative to this page, which
   is why "Purchase" and "See More Details" both 404ed. Add the scheme back at
   render time so existing rows work without a data migration. Anything that is
   not http or https is dropped rather than rendered. */
function safeUrl(raw){
  const s = String(raw||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return "";   // mailto:, javascript:, etc.
  if(/^\/\//.test(s)) return "https:"+s;
  return "https://"+s.replace(/^\/+/, "");
}

function isPurchased(t){
  if(t.kind!=="gift") return false;
  const req = (t.raw && t.raw.quantity_requested) || 1;
  const ful = (t.raw && (t.raw.quantity_purchased != null
                          ? t.raw.quantity_purchased
                          : t.raw.quantity_fulfilled)) || 0;
  return req > 0 && ful >= req;
}

function passesFilters(t){
  const f=state.filters, q=f.search.trim().toLowerCase();
  if(f.cats.size && !f.cats.has(t.fcat)) return false;
  if(f.price.size){
    const ok=[...f.price].some(id=>{ const b=PRICE_BUCKETS.find(x=>x.id===id); return b&&b.test(t.amount); });
    if(!ok) return false;
  }
  if(q && !((t.title+" "+(t.location||"")+" "+(t.fcat||"")).toLowerCase().includes(q))) return false;
  const st = state.filters.status || "all";
  if(st==="purchased" && !isPurchased(t)) return false;
  if(st==="pending"   &&  isPurchased(t)) return false;
  if(st==="preferred" && !t.mostWanted)   return false;
  return true;
}

function sortList(list){
  const s=state.filters.sort;
  const a=[...list];
  // "custom" = exactly the order the couple dragged into (no most-wanted bump),
  // so what they arrange in preview is what guests see.
  if(s==="custom") { a.sort((x,y)=>x.sort-y.sort); return a; }
  if(s==="price_asc")  a.sort((x,y)=>x.amount-y.amount);
  else if(s==="price_desc") a.sort((x,y)=>y.amount-x.amount);
  else if(s==="name_asc")   a.sort((x,y)=>x.title.localeCompare(y.title));
  else if(s==="name_desc")  a.sort((x,y)=>y.title.localeCompare(x.title));
  else a.sort((x,y)=>x.sort-y.sort);   // custom / couple's order
  return a;
}

/* ─── Render ────────────────────────────────────────── */
function render(){
  const r=state.data.registry||{}, couple=state.data.couple||{};
  const name = couple.name || r.title || "Our Registry";
  const dateStr = couple.date ? new Date(couple.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",timeZone:"UTC"}) : "";
  const hero = r.hero_image_url || HERO_PLACEHOLDER;
  // Does this couple want a header photo at all? The API sends use_header_photo
  // once the backend exposes the "Use Header Photo" field (CvT7i). Until then,
  // infer it from whether a cover exists, since switching the toggle off also
  // clears the cover.
  const heroFlag = r.use_header_photo;
  const wantsHero = (heroFlag === undefined || heroFlag === null)
    ? !!r.hero_image_url
    : !(heroFlag === false || heroFlag === 0 || heroFlag === "false" || heroFlag === "");

  const matched = state.things.filter(passesFilters);
  const total = matched.length;
  const activeCount = state.filters.cats.size + state.filters.price.size;

  // One flat grid — gifts, cash funds and experiences together, in the couple's
  // order (matches the design; no category accordions).
  const groupsHtml = matched.length
    ? '<div class="grid">'+sortList(matched).map(renderCard).join("")+'</div>'
    : '<div class="empty">Nothing on the registry yet.</div>';

  el("app").innerHTML =
      '<header class="rhero'+(wantsHero?'':' no-photo')+'">'
    +   (wantsHero
          ? '<div class="rhero-img">'
            + '<img src="'+esc(hero)+'" alt="" onerror="this.src=\''+HERO_PLACEHOLDER+'\'">'
            + (state.preview
                ? '<label class="rh-edit" title="Change cover photo">'
                  + pencilSvg()
                  + '<input type="file" accept="image/*" onchange="uploadCover(event)">'
                  + '</label>'
                : '')
            + '</div>'
          : '')
    +   '<div class="rhero-panel">'
    +     '<h1 class="serif rh-title'+(state.preview?' ed':'')+'"'
    +       (state.preview?' contenteditable="true" data-field="title" onblur="savePresentation(this)"':'')
    +       '>'+mdInline(r.title || name)+'</h1>'
    +     '<div class="rh-note'+(state.preview?' ed':'')+'"'
    +       (state.preview?' contenteditable="true" data-field="welcome_note" onblur="savePresentation(this)" data-ph="Add a welcome note for your guests…"':'')
    +       '>'+(r.welcome_note || '')+'</div>'
    +     (couple.name?'<div class="rh-sig serif">'+esc(couple.name)+'</div>':'')
    +     (dateStr?'<div class="rh-date">'+esc(dateStr)+'</div>':'')
    +     (state.preview?'<button class="rh-edit panel" title="Edit text" onclick="focusTitle()">'+pencilSvg()+'</button>':'')
    +   '</div>'
    + '</header>'

    + quickFiltersHtml(matched.length)

    + '<div class="content"><div class="wrap">'
    +   (groupsHtml || '<div class="empty"><div class="ring"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h3 class="serif" style="font-size:22px;color:#fff;margin-bottom:6px">No gifts match your filters</h3><p style="color:rgba(255,255,255,.85);font-size:13px;margin-bottom:16px">Try broadening your search or clearing some filters.</p>'+(activeCount||state.filters.search?'<button class="btn btn-primary" style="width:auto;padding:9px 22px" onclick="clearFilters()">Clear filters</button>':"")+'</div>')
    + '</div></div>'

    + renderExternalLinks();

  renderDrawer();

function renderExternalLinks(){

function renderPills(){

/* A cash fund hides its amount when the couple turned the goal off, or when
   it's an "any amount" fund (goal 0). */
function hidesAmount(t){

}

function renderCard(t){
  const phSvg='<svg class="ph" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>';

    ? '<img src="'+esc(t.image)+'" alt="'+esc(t.title)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+phSvg.replace('class="ph"','class="ph" style="display:none"')
    : phSvg;

  // Top label, exactly as the design reads it.
  let badges="";
  if(t.mostWanted) badges+='<span class="badge want">Couple Preferred</span>';
  if(t.kind==="experience")   badges+='<span class="badge exp">Experience</span>';
  else if(t.kind==="fund")    badges+='<span class="badge group">Cash Fund</span>';
  else {
    const req=(t.raw&&t.raw.quantity_requested)||1;
    const ful=(t.raw&&(t.raw.quantity_purchased!=null?t.raw.quantity_purchased:t.raw.quantity_fulfilled))||0;
    const rem=Math.max(0,req-ful);
    if(ful>=req && req>0) badges+='<span class="badge group">Purchased</span>';
    else if(req>1)        badges+='<span class="badge want">'+rem+' of '+req+' Needed</span>';
  }

  let sub="", prog="";
  if(t.kind==="experience"){
    sub = t.location ? esc(t.location) : "Honeymoon experience";
    if(t.amount>0){ const pct=Math.min(100,Math.round((t.received/t.amount)*100)); prog='<div class="progress"><i style="width:'+pct+'%"></i></div>'; sub+=' · '+fmt(t.received)+' of '+fmt(t.amount); }
  } else if(t.kind==="fund"){
    // The couple can hide the target ("Show Goal to Guests?" = off), and a goal
    // of 0 means "any amount" — either way we don't show a number.
    const showGoal = t.raw && t.raw.show_goal && t.amount > 0;
    sub = showGoal ? ("Goal "+fmt(t.amount)) : "Any amount welcome";
  }
  else { sub = ""; }

  // CTAs by kind
  let cta="";
  if(t.kind==="gift"){
    const bought = isPurchased(t);
    cta = '<div class="cta-row col">'
        + (bought
            ? (t.hasTracking
                ? '<button class="cta out" onclick="event.stopPropagation();openAddTracking(\''+t.id+'\')">Update tracking &rarr;</button>'
                : '<button class="cta solid" onclick="event.stopPropagation();openAddTracking(\''+t.id+'\')">Add tracking &rarr;</button>')
            : '<button class="cta solid" onclick="event.stopPropagation();openHow(\''+t.id+'\')">Purchase &rarr;</button>')
        + (bought
            ? '<span class="ipurch done">✓ Purchased, thank you!</span>'
            : '<label class="ipurch" onclick="event.stopPropagation()">'
              + '<input type="checkbox" onchange="openOffline(\''+t.id+'\')"> I Purchased This Item'
              + '</label>')
        + '</div>';
  } else if(t.kind==="fund"){
    cta = '<div class="cta-row col"><button class="cta solid" onclick="event.stopPropagation();openFund(\''+t.id+'\')">Contribute</button><span class="ipurch spacer" aria-hidden="true"></span></div>';
  } else {
    cta = '<div class="cta-row col"><button class="cta solid" onclick="event.stopPropagation();openExp(\''+t.id+'\')">Contribute</button><span class="ipurch spacer" aria-hidden="true"></span></div>';
  }

  const openFn = t.kind==="experience" ? "openExp" : (t.kind==="fund" ? "openFund" : "openDetail");

  // Preview mode: the couple can drag gifts/funds to reorder them. Experiences
  // live in a separate table that bulk-sort doesn't cover, so they stay fixed.
  const canDrag = state.preview;   // all cards reorderable
  const dragAttrs = canDrag
    ? ' draggable="true" data-id="'+t.id+'" data-kind="'+t.kind+'"'
      + ' ondragstart="dragStart(event)" ondragover="dragOver(event)"'
      + ' ondrop="dragDrop(event)" ondragend="dragEnd(event)"'
    : '';
  // Preview: a grab handle sits in the CENTRE of the image (no separate
  // "rearrange" mode — the couple just drags).
  const handle = canDrag
    ? '<div class="drag-handle" title="Drag to reorder">'
      + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>'
      + '</svg></div>'
    : '';

  // Most-wanted heart (top-right). In preview it's a toggle; for guests it's
  // just an indicator of what the couple wants most.
  const heartFill = t.mostWanted ? '#A9BDC4' : 'none';
  const heartCls  = 'heart' + (t.mostWanted ? ' on' : '') + (state.preview && t.kind!=="experience" ? ' tap' : '');
  const heartClick = (state.preview && t.kind!=="experience")
    ? ' onclick="event.stopPropagation();toggleWanted(\''+t.id+'\')"' : '';
  const heart = (t.kind!=="experience")
    ? '<div class="'+heartCls+'"'+heartClick+' title="'+(t.mostWanted?'Most wanted':'Mark as most wanted')+'">'
      + '<svg width="17" height="17" viewBox="0 0 24 24" fill="'+heartFill+'" stroke="#A9BDC4" stroke-width="1.8">'
      + '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/>'
      + '</svg></div>'
    : '';

  // The couple's note, wherever they've written one.
  const note = t.raw && t.raw.couple_note
    ? '<div class="cnote"><span class="q">&ldquo;</span>'+esc(t.raw.couple_note)
      +'<span class="q close">&rdquo;</span></div>' : '';

  const brandName = brandOf(t.raw);
  const brandLine = brandName ? '<div class="brand">'+esc(brandName)+'</div>' : '';
  // Sits directly under the title, which is where two near-identical gifts are
  // compared.
  const variantLine = t.kind === "gift" ? variantHtml(t.raw) : "";

  return '<div class="card'+(canDrag?' draggable':'')+'"'+dragAttrs+'>'
    + handle
    + '<div class="card-click" onclick="'+openFn+'(\''+t.id+'\')">'
    +   '<div class="imgwrap">'
    +     heart
    +     '<div class="badges">'+badges+'</div>'
    +     img
    +   '</div>'
    +   '<div class="body">'+brandLine
    +     '<div class="ttl">'+esc(t.title)+'</div>'
    +     variantLine
    +     (hidesAmount(t)?'':'<div class="price">'+fmt(t.amount)+'</div>')
    +     note
    +   '</div>'
    +   prog
    + '</div>'
    + cta
    + '</div>';
}

function toggleWanted(id){

  t.mostWanted = !before;      // optimistic

    method:"PATCH", headers:{"Content-Type":"application/json"},

  }).then(r=>{ if(!r.ok) throw new Error("save failed"); toastPreview(t.mostWanted?"Marked most wanted":"Removed from most wanted"); })
   .catch(()=>{ t.mostWanted = before; render(); toastPreview("Couldn't save that", true); });

/* ─── Preview: drag to reorder ───────────────────────────────
   Only available when the couple opens their own registry with ?preview=1.
   Order is persisted with POST /registry/items/bulk-sort (gifts + cash funds;
   both are registry items). Optimistic: the grid re-renders immediately and we
   reconcile — or roll back — once the write returns. */
let dragSrcId = null;

function dragStart(e){
  const card = e.currentTarget;
  dragSrcId = card.getAttribute("data-id");
  card.classList.add("dragging");
  try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragSrcId); } catch(_){}
}
function dropSide(e, card){
  // Which half of the target is the cursor over? Left/top → insert before,
  // right/bottom → insert after. Uses horizontal midpoint (grid flows in rows).
  const r = card.getBoundingClientRect();
  return (e.clientX - r.left) > r.width/2 ? "after" : "before";
}
function dragOver(e){
  e.preventDefault();
  try { e.dataTransfer.dropEffect = "move"; } catch(_){}
  const card = e.currentTarget;
  if(card.getAttribute("data-id") === dragSrcId) return;
  document.querySelectorAll(".drop-before,.drop-after").forEach(n=>n.classList.remove("drop-before","drop-after"));
  card.classList.add(dropSide(e, card)==="after" ? "drop-after" : "drop-before");
}
function dragEnd(e){
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".drop-target,.drop-before,.drop-after").forEach(n=>n.classList.remove("drop-target","drop-before","drop-after"));
}
function dragDrop(e){
  e.preventDefault();
  const target = e.currentTarget;
  const side = dropSide(e, target);
  document.querySelectorAll(".drop-target,.drop-before,.drop-after").forEach(n=>n.classList.remove("drop-target","drop-before","drop-after"));
  const targetId = target.getAttribute("data-id");
  if(!dragSrcId || !targetId || dragSrcId===targetId) return;
  reorder(dragSrcId, targetId, side);
}

function reorder(srcId, targetId, side){
  const src = state.things.find(t=>t.id===srcId);
  const tgt = state.things.find(t=>t.id===targetId);
  if(!src || !tgt || srcId===targetId) return;

  // Reorder across the ENTIRE visible list (gifts, funds and experiences mixed),
  // exactly as shown. Every card gets a single global position so a card can be
  // dropped smoothly between any two others regardless of kind.
  const list = sortList(state.things.filter(passesFilters));
  const from = list.findIndex(t=>t.id===srcId);
  const to   = list.findIndex(t=>t.id===targetId);
  if(from<0 || to<0) return;

  const before = list.map(t=>({id:t.id, sort:t.sort}));   // for rollback
  const moved = list.splice(from,1)[0];                   // pull the dragged card
  // Recompute the target index after removal, then insert before/after it.
  let insert = list.findIndex(t=>t.id===targetId);
  if(side==="after") insert += 1;
  if(insert<0) insert = list.length;
  list.splice(insert, 0, moved);                          // drop at the chosen spot
  list.forEach((t,i)=>{ t.sort = i; });                   // one global 0..n-1 order

  // A manual order only makes sense under "custom" sort — switch to it so the
  // new order is what's actually displayed.
  state.filters.sort = "custom";
  render();

  // Persist per table: gifts + cash funds are registry items (one endpoint);
  // experiences live in their own table (their own endpoint). Each keeps its
  // GLOBAL sort index, so both tables agree on one combined order.
  const itemPayload = list.filter(t=>t.kind!=="experience").map(t=>({ id:t.id, sort_order:t.sort }));
  const expPayload  = list.filter(t=>t.kind==="experience").map(t=>({ id:t.id, sort_order:t.sort }));

  const calls = [];
  if(itemPayload.length) calls.push(fetch(RENDER_API+"/registry/items/bulk-sort", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ items: itemPayload })
  }));
  if(expPayload.length) calls.push(fetch(RENDER_API+"/registry/experiences/bulk-sort", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ items: expPayload })
  }));

  Promise.all(calls).then(async resps=>{
    for(const r of resps){
      if(!r.ok) throw new Error("save failed");
      const j = await r.json();
      if((j.results||[]).some(x=>!x.ok)) throw new Error("some items didn't save");
    }
    toastPreview("Order saved");
  }).catch(()=>{
    before.forEach(b=>{ const t=state.things.find(x=>x.id===b.id); if(t) t.sort=b.sort; });
    render();
    toastPreview("Couldn't save the new order", true);
  });
}

/* ─── Guest purchase journey ──────────────────────────────
   1. "How This Works"  → explains buy-then-come-back-and-mark.
   2. "Did You Purchase This?" → after they return from the retailer.
   3. Purchase form → name + note for the couple, so the gift is logged. */
// "shop.nordstrom.com/x" -> "Nordstrom", "williams-sonoma.com" -> "Williams
// Sonoma". Every gift carries its own link, so the button can name the right
// shop instead of always saying Amazon.
function retailerName(url){
  try{
    var host=String(url||"").replace(/^https?:\/\//,"").split("/")[0].split(":")[0]
      .replace(/^www\./,"").toLowerCase();
    var parts=host.split(".").filter(Boolean);
    if(!parts.length) return "";
    var core = parts.length>1 ? parts[parts.length-2] : parts[0];
    if(["co","com","net","org","ac"].indexOf(core)>-1 && parts.length>=3) core=parts[parts.length-3];
    if(!core) return "";
    return core.split("-").map(function(w){
      return w ? w.charAt(0).toUpperCase()+w.slice(1) : w;
    }).join(" ");
  }catch(e){ return ""; }
}

/* MP-415. A gift added by pasting a link is stored with source "Universal URL",
   which is our plumbing showing through: a guest wants to know the shop. Derive
   it from the link, the way the "Head to …" button already does, and fall back
   to the stored value only when there is no link to read.

   Module scope, because the source is printed in THREE places — the card, the
   purchase modal and the detail modal — and I fixed only the card the first
   time. One rule, one place, or the next surface added will print the raw value
   again. */
function brandOf(raw){
  const stored = (raw && raw.source) ? String(raw.source) : "";
  const generic = /^(universal url|universal|custom|other|link)$/i.test(stored.trim());
  if (stored && !generic) return stored;
  const fromUrl = raw ? retailerName(raw.source_url) : "";
  return fromUrl || (generic ? "" : stored);
}

function rerender(keepFocus){

  render();
  if(drawerOpen){ el("drawer").classList.add("open"); el("scrim").classList.add("open"); }
  if(focused){ const si=el("search"); if(si){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); } }
}

/* ─── Physical gift detail (zoom) ───────────────────── */

/* ─── Mark purchased offline ────────────────────────── */
/* Carriers come from the backend so we never offer an option the Shipping
   Method select doesn't actually have. */
let SHIP_METHODS = [];
function loadShipMethods(){
  fetch(RENDER_API+"/registry/shipping-methods")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && Array.isArray(d.methods)) SHIP_METHODS = d.methods; })
    .catch(function(){});
}
function shipOptionsHtml(){
  return SHIP_METHODS.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join("");
}

/* A guest who marked a gift purchased before the retailer shipped can come
   back any time and add the tracking. We find their contribution by the name
   they used. */
function openAddTracking(id){
  const t = state.things.find(function(x){ return x.id===id; });
  if(!t) return;
  const img = t.image ? '<img class="m-img" src="'+esc(t.image)+'" alt="">' : '';
  showFlow(
      '<h3 class="serif m-title">Add Tracking</h3>'
    + img
    + '<p class="m-body">Already bought this? Add the tracking so '+esc(coupleLabel())+'<br>can follow it on its way.</p>'
    + '<div class="m-form">'
    +   '<label>The name you used</label>'
    +   '<input id="tk-name" type="text" placeholder="e.g. Elizabeth Johnson">'
    +   '<label>Shipping Method</label>'
    +   '<select id="tk-ship">'+shipOptionsHtml()+'</select>'
    +   '<label>Tracking Number</label>'
    +   '<input id="tk-num" type="text">'
    +   '<button class="m-cta dark" id="tk-submit" onclick="submitTracking(\''+t.id+'\')">Save tracking</button>'
    + '</div>',
    "sage"
  );
}

function submitTracking(id, shipOverride, confirmed){
  const name=(el("tk-name")||{}).value ? el("tk-name").value.trim() : (state.tkName||"");
  const num =(el("tk-num") ||{}).value ? el("tk-num").value.trim()  : (state.tkNum||"");
  const ship= shipOverride !== undefined ? shipOverride : (((el("tk-ship")||{}).value)||"");
  if(!name){ toastPreview("Add the name you used", true); return; }
  if(!num){  toastPreview("Add a tracking number", true); return; }
  // Remembered so the carrier question can resubmit after the form is replaced.
  state.tkName = name; state.tkNum = num;

  const btn=el("tk-submit");
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…'; }
  fetch(RENDER_API+"/registry/tracking/update",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ registry_id: state.registryId, item_id: id,
                           guest_name: name, tracking_number: num, shipping_method: ship,
                           shipping_method_confirmed: !!confirmed })
  }).then(function(r){
      if(r.ok) return r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        const d = j.detail;
        // MP-403: the carrier saved with the purchase disagrees with this one.
        // Ask rather than guessing which the guest meant.
        if(d && d.conflict === "shipping_method"){
          askCarrier(id, d.stored, d.provided, d.message);
          throw new Error("__asked__");
        }
        throw new Error((d && d.message) || d || "Couldn't save that");
      });
    })
   .then(function(){
      closeFlow();
      toastPreview("Thank you! Tracking saved.");
      // Refresh so the card stops offering "Add tracking" straight away. The
      // visibility handler only fires on returning to the tab, which is why
      // this looked stale until you switched away and back.
      load();
    })
   .catch(function(e){
      if(e && e.message === "__asked__") return;   // the question is on screen
      const b=el("tk-submit");
      if(b){ b.disabled=false; b.innerHTML="Save tracking"; }
      toastPreview((e && e.message) || "Couldn't save that", true);
    });
}

/* MP-403: which carrier is right? Only ever two options, both named, so the
   guest picks rather than us guessing. The name and number are already held in
   state, so answering finishes the save without retyping anything. */
function askCarrier(id, stored, provided, message){
  /* Handlers are attached in JS, not written into onclick attributes. Building
     them as strings meant JSON.stringify's double quotes closed the attribute
     early and the button did nothing at all; escaping quotes by hand would work
     until a carrier name contains one. This has no escaping to get wrong. */
  showFlow(
      '<h3 class="serif m-title">Which carrier?</h3>'
    + '<p class="m-body" style="text-align:center">'+esc(message||"")+'</p>'
    + '<div class="m-actions col">'
    +   '<button class="m-cta dark" id="ck-use">Use '+esc(provided)+'</button>'
    +   '<button class="m-cta" id="ck-keep">Keep '+esc(stored)+'</button>'
    + '</div>',
    "sage"
  );
  const use = el("ck-use"), keep = el("ck-keep");
  if(use)  use.onclick  = function(){ submitTracking(id, provided, true); };
  if(keep) keep.onclick = function(){ submitTracking(id, stored, true); };
}

function submitOffline(id){
  const first=(el("g-first").value||"").trim();
  const last =(el("g-last").value||"").trim();
  const note =(el("g-note").value||"").trim();
  const name =[first,last].filter(Boolean).join(" ");
  if(!name){ toastPreview("Please add your name", true); return; }
  const btn=el("off-submit"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Saving…';
  fetch(RENDER_API+"/registry/items/mark-purchased-offline",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ registry_id: state.registryId, item_id: id,
                           guest_name: name, quantity: 1, note: note,
                           shipping_method: (el("g-ship")||{}).value || "",
                           tracking_number: ((el("g-track")||{}).value || "").trim() })
  }).then(r=>{
      // Read the body on failure: the server now returns the real reason, and
      // "Couldn't save that" on its own gives nobody anything to act on.
      if(!r.ok) return r.text().then(t=>{ throw new Error((t||"").slice(0,160) || "save failed"); });
      return r.json();
    })
   .then(()=>{ closeFlow(); toastPreview("Thank you! The couple has been told."); load(); })
   .catch(err=>{
     btn.disabled=false; btn.innerHTML="Save and Go Back to Registry";
     console.error("mark-purchased-offline failed:", err);
     toastPreview((err && err.message && err.message!=="save failed")
       ? ("Couldn't save that. "+err.message) : "Couldn't save that", true);
   });
}

/* ─── Cash fund / group gift contribute ─────────────── */
function openFund(id){
  const it=(state.data.items||[]).find(x=>x.id===id); if(!it) return;
  state.activeItem=it;
  const r=state.data.registry||{};
  const stripeOk = r.has_stripe_connect && r.stripe_active;
  /* MP-418. Settings shows "@yourname" as the example, so couples type the
     symbol, and this page adds its own: "@@yourname", and a Venmo URL with a
     stray @ in it that does not resolve. Strip whatever they typed and let the
     page own the prefix. Done here rather than only at the input, because the
     handles already saved with a symbol have to render correctly too. */
  const bareHandle = (v) => String(v||"").trim().replace(/^[@$]+/,"");
  const handles = (function(){
    const h = r.payment_handles||{};
    return { venmo: bareHandle(h.venmo), paypal: bareHandle(h.paypal),
             cashapp: bareHandle(h.cashapp) };
  })();
  const anyHandle = handles.paypal||handles.venmo||handles.cashapp;
  const img = it.image_url || CASHFUND_BG;
  const amount = isFund(it)?(it.goal_amount_cents||0):(it.price_cents||0);
  const min = it.min_contribution_cents || 2500;

  let body="";
  if(stripeOk){
    body = '<div class="field"><label>Your contribution ($)</label><input type="number" id="g-amt" min="'+(min/100)+'" step="1" oninput="updateFeeLine()" value="'+Math.max(25,Math.round(min/100))+'"></div>'
      + '<div class="row2"><div class="field"><label>Your name</label><input type="text" id="g-name"></div><div class="field"><label>Email</label><input type="email" id="g-email"></div></div>'
      + '<div class="field"><label>A note to the couple <span style="color:var(--muted);font-style:normal">(optional)</span></label><textarea id="g-note" placeholder="Wishing you both a lifetime of happiness…"></textarea></div>'
      + '<label class="check"><input type="checkbox" id="g-anon"> Keep my gift anonymous</label>'
      + '<div class="field"><label>How would you like to pay?</label>'
      +   '<div class="rail-row">'
      +     '<label class="rail-opt"><input type="radio" name="g-rail" value="card" checked onchange="updateFeeLine()"> '
      +       '<span><strong>Card</strong><span class="rail-sub">Instant</span></span></label>'
      +     '<label class="rail-opt"><input type="radio" name="g-rail" value="ach" onchange="updateFeeLine()"> '
      +       '<span><strong>Bank transfer</strong><span class="rail-sub">Lower fee, takes a few days</span></span></label>'
      +   '</div></div>'
      + '<div class="hint" id="g-fee-line"></div>'
      + '<button class="mbtn primary" id="g-submit" onclick="submitContribution()">Contribute '+fmt(min)+'+ via Stripe →</button>'
      + '<div class="hint">Secure checkout via Stripe. Your gift goes straight to the couple.</div>';
  } else if(anyHandle){
    body = '<p class="hint" style="margin-top:0">Send your gift directly to the couple:</p><div class="pay-grid">'
      + (handles.venmo?'<a class="pay-opt" target="_blank" rel="noopener" href="https://venmo.com/u/'+encodeURIComponent(handles.venmo)+'">Venmo<span style="color:var(--muted)">@'+esc(handles.venmo)+'</span></a>':"")
      + (handles.paypal?'<a class="pay-opt" target="_blank" rel="noopener" href="https://paypal.me/'+encodeURIComponent(handles.paypal)+'">PayPal<span style="color:var(--muted)">'+esc(handles.paypal)+'</span></a>':"")
      + (handles.cashapp?'<a class="pay-opt" target="_blank" rel="noopener" href="https://cash.app/$'+encodeURIComponent(handles.cashapp)+'">Cash App<span style="color:var(--muted)">$'+esc(handles.cashapp)+'</span></a>':"")
      + '</div>';
  } else {
    body = '<div class="hint">'+esc(coupleLabel())+' have not connected a bank account to receive cash gifts yet. Please check back soon.</div>';
  }

  el("fund-modal").innerHTML =
      '<div class="m-img">'+(img?'<img src="'+esc(img)+'" alt="" onerror="this.remove()">':"")+'<button class="m-close" onclick="closeModal(\'fund\')">✕</button></div>'
    + '<div class="m-pad"><div class="m-sub">Cash fund</div><h3 class="serif">'+esc(it.title)+'</h3>'
    +   '<div class="m-price">'+fmt(amount)+' <span style="font-size:13px;color:var(--muted);font-family:\'Open Sans\'">goal</span></div>'
    +   (it.description?'<p class="m-desc">'+esc(it.description)+'</p>':"")
    +   (it.couple_note?'<div class="m-note">“'+esc(it.couple_note)+'”</div>':"")
    +   body
    + '</div>';
  openModal("fund");
}
/* Mirrors gross_up() in main.py. Shown BEFORE checkout so the fee is never a
   surprise on Stripe's page; the server recomputes it and is authoritative. */
function grossUp(giftCents, rail){
  const g = Math.max(0, Math.round(giftCents||0));
  if(!g) return { gift:0, fee:0, total:0 };
  let total;
  if(rail === "ach"){
    total = Math.ceil(g / (1 - 0.008));
    if(total - g > 500) total = g + 500;      // $5 cap
  } else {
    total = Math.ceil((g + 30) / (1 - 0.029));
  }
  return { gift:g, fee: total - g, total:total };
}

function selectedRail(){
  const r = document.querySelector('input[name="g-rail"]:checked');
  return r ? r.value : "card";
}

function updateFeeLine(){
  const line = el("g-fee-line"); if(!line) return;
  const it = state.activeItem || {};
  const min = it.min_contribution_cents || 2500;
  const dollars = parseFloat(el("g-amt") ? el("g-amt").value : "0") || 0;
  const cents = Math.round(dollars*100);
  if(cents < 1){ line.textContent = ""; return; }
  const rail = selectedRail();
  const f = grossUp(cents, rail);
  line.innerHTML = "The couple receives <strong>" + fmt(f.gift) + "</strong>. "
    + "You'll be charged " + fmt(f.total) + ", which includes a "
    + fmt(f.fee) + " " + (rail === "ach" ? "bank transfer" : "card") + " processing fee. "
    + "MyPlanning doesn't charge or keep any part of it."
    + (rail === "ach" ? " Bank transfers take a few days to clear." : "");
}

async function submitContribution(){
  const it=state.activeItem; if(!it) return;
  const min = it.min_contribution_cents || 2500;
  const name=(el("g-name")?el("g-name").value:"").trim();
  const email=(el("g-email")?el("g-email").value:"").trim();
  const note=(el("g-note")?el("g-note").value:"").trim();
  const anon=el("g-anon")?el("g-anon").checked:false;
  const dollars=parseFloat(el("g-amt")?el("g-amt").value:"0")||0;
  const amount_cents=Math.round(dollars*100);
  if(amount_cents<min){ alert("Minimum contribution is "+fmt(min)+"."); return; }
  if(!name){ alert("Please enter your name."); return; }
  if(!email){ alert("Please enter your email."); return; }
  const btn=el("g-submit"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Redirecting to Stripe…';
  try{
    const ret=retUrl(), sep=ret.includes("?")?"&":"?";
    const res=await fetch(RENDER_API+"/public/registry/"+state.registryId+"/checkout",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ item_id:it.id, guest_name:name, guest_email:email, amount_cents, quantity:1,
        payment_rail:selectedRail(),
        gift_note:note||null, is_anonymous:anon, success_url:ret+sep+"contribution=success", cancel_url:ret+sep+"contribution=cancel" }),
    });
    if(!res.ok) throw new Error(await errText(res));
    const data=await res.json();
    if(data.session_url) location.href=data.session_url; else throw new Error("Checkout session URL missing");
  }catch(e){ alert("Couldn't start checkout: "+e.message); btn.disabled=false; btn.innerHTML="Contribute via Stripe →"; }
}

/* ─── Experience contribute ─────────────────────────── */
function openExp(id){
  const exp=(state.data.experiences||[]).find(x=>x.id===id); if(!exp) return;
  state.activeExp=exp;
  const r=state.data.registry||{};
  const stripeOk=r.has_stripe_connect && r.stripe_active;
  const img=exp.image_url||EXPERIENCE_BG;
  const cost=exp.cost_cents||0, min=exp.min_contribution_cents||2500;
  const received=exp.amount_received_cents||0, remaining=Math.max(0,cost-received);
  const pct = cost>0?Math.min(100,Math.round((received/cost)*100)):0;

  const form = stripeOk ?
      ((exp.allow_partial
        ? '<div class="field"><label>Your contribution ($)</label><input type="number" id="e-amt" min="'+(min/100)+'" step="1" value="'+Math.max(25,Math.round(min/100))+'"></div>'
        : '<div class="hint" style="text-align:left;margin:8px 0 0">This experience is gifted in full: <strong>'+fmt(cost)+'</strong>.</div>')
      + '<div class="row2"><div class="field"><label>Your name</label><input type="text" id="e-name"></div><div class="field"><label>Email</label><input type="email" id="e-email"></div></div>'
      + '<div class="field"><label>A note for the couple <span style="color:var(--muted);font-style:normal">(optional)</span></label><textarea id="e-note" placeholder="Enjoy every moment…"></textarea></div>'
      + '<div class="field"><label>Display name on their memory wall <span style="color:var(--muted);font-style:normal">(optional)</span></label><input type="text" id="e-display" placeholder="e.g. Aunt Mei & Family"></div>'
      + '<label class="check"><input type="checkbox" id="e-journal" checked> Add my note to the couple\'s travel journal</label>'
      + '<label class="check"><input type="checkbox" id="e-anon"> Keep my gift anonymous</label>'
      + '<button class="mbtn primary" id="e-submit" onclick="submitExp()">Contribute via Stripe →</button>'
      + '<div class="hint">Secure checkout via Stripe. Your gift funds a real moment on their trip.</div>')
    : '<div class="hint">The couple hasn\'t finished setting up experience gifting yet. Please check back soon.</div>';

  el("exp-modal").innerHTML =
      '<div class="m-img">'+(img?'<img src="'+esc(img)+'" alt="" onerror="this.remove()">':"")+'<button class="m-close" onclick="closeModal(\'exp\')">✕</button></div>'
    + '<div class="m-pad"><div class="m-sub">Experience'+(exp.location?' · '+esc(exp.location):"")+'</div><h3 class="serif">'+esc(exp.title)+'</h3>'
    +   '<div class="m-price">'+fmt(cost)+'</div>'
    +   (cost>0?'<div class="progress" style="margin:6px 0 4px"><i style="width:'+pct+'%"></i></div><div class="sub" style="color:var(--olive);font-size:12px;margin-bottom:4px">'+fmt(received)+' funded · '+fmt(remaining)+' to go</div>':"")
    +   (exp.description?'<p class="m-desc">'+esc(exp.description)+'</p>':"")
    +   form
    + '</div>';
  openModal("exp");
}
async function submitExp(){
  const exp=state.activeExp; if(!exp) return;
  const name=(el("e-name")?el("e-name").value:"").trim();
  const email=(el("e-email")?el("e-email").value:"").trim();
  const note=(el("e-note")?el("e-note").value:"").trim();
  const display=(el("e-display")?el("e-display").value:"").trim();
  const journal=el("e-journal")?el("e-journal").checked:false;
  const anon=el("e-anon")?el("e-anon").checked:false;
  let amount_cents;
  if(exp.allow_partial){
    const d=parseFloat(el("e-amt")?el("e-amt").value:"0")||0; amount_cents=Math.round(d*100);
    const min=exp.min_contribution_cents||2500;
    if(amount_cents<min){ alert("Minimum contribution is "+fmt(min)+"."); return; }
  } else { amount_cents=exp.cost_cents||0; }
  if(!name){ alert("Please enter your name."); return; }
  if(!email){ alert("Please enter your email."); return; }
  const btn=el("e-submit"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Redirecting to Stripe…';
  try{
    const ret=retUrl(), sep=ret.includes("?")?"&":"?";
    const res=await fetch(RENDER_API+"/public/registry/"+state.registryId+"/checkout",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ experience_id:exp.id, guest_name:name, guest_email:email, amount_cents,
        gift_note:note||null, display_name:anon?null:(display||null), show_in_journal:journal, is_anonymous:anon,
        success_url:ret+sep+"contribution=success", cancel_url:ret+sep+"contribution=cancel" }),
    });
    if(!res.ok) throw new Error(await errText(res));
    const data=await res.json();
    if(data.session_url) location.href=data.session_url; else throw new Error("Checkout session URL missing");
  }catch(e){ alert("Couldn't start checkout: "+e.message); btn.disabled=false; btn.innerHTML="Contribute via Stripe →"; }
}

/* ─── Modal plumbing + helpers ──────────────────────── */
function openModal(k){ el(k+"-scrim").classList.add("open"); document.body.style.overflow="hidden"; }
function closeModal(k){ el(k+"-scrim").classList.remove("open"); document.body.style.overflow=""; }
function retUrl(){ return state.slug ? (location.origin+location.pathname) : (location.origin+location.pathname+"?id="+encodeURIComponent(state.registryId)); }
async function errText(res){ const t=await res.text(); try{ return JSON.parse(t).detail||t; }catch(e){ return t; } }

/* ─── Password gate & notices ───────────────────────── */
function renderGate(title, invalid){
  el("app").innerHTML =
      '<div class="gate"><div class="gate-card"><div class="eyebrow">Private registry</div>'
    + '<h2 class="serif" style="margin-top:6px">'+mdInline(title)+'</h2>'
    + '<p>This registry is password-protected. Please enter the password the couple shared with you.</p>'
    + '<div class="field"><input type="password" id="gate-pw" placeholder="Password" style="text-align:center"></div>'
    + (invalid?'<div style="color:#C23331;font-size:12px;margin-top:8px">That password didn\'t match. Please try again.</div>':"")
    + '<button class="mbtn primary" onclick="submitGate()">Unlock registry</button></div></div>';
  setTimeout(()=>{ const g=el("gate-pw"); if(g){ g.focus(); g.addEventListener("keydown",e=>{ if(e.key==="Enter") submitGate(); }); } },50);
}
function submitGate(){ const g=el("gate-pw"); const v=g?g.value.trim():""; if(!v) return; state.password=v; el("app").innerHTML='<div class="center-load"><span class="spinner"></span></div>'; load(); }
function renderNotice(title,sub){ el("app").innerHTML='<div class="gate"><div class="gate-card"><h2 class="serif">'+esc(title)+'</h2><p style="margin-bottom:0">'+esc(sub)+'</p></div></div>'; }
</script>
